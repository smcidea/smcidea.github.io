name: Daily NEPSE OHLC update

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "NEPSE trading date to scrape, YYYY-MM-DD"
        required: false
        type: string
  schedule:
    # 10:30 UTC = 16:15 Nepal time (NPT), Monday-Friday.
    # The updater compares ShareSansar's source date with stored history, so a
    # delayed run can catch up after midnight without adding duplicate dates.
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-nepse-update
  cancel-in-progress: false

jobs:
  update-nepse-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scraper dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Fetch and validate NEPSE data
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/update_nepse.py \
              --date "$TARGET_DATE" \
              --min-symbols 100
          else
            python scripts/update_nepse.py --min-symbols 100
          fi

      - name: Commit repository data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: update NEPSE OHLC $(date -u +%F)"
          git push
